name: Build Kernel A32 4G
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build
        run: |
          export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          make O=out clean
          make O=out a32_defconfig
          make O=out -j$(nproc --all) \
            CC=aarch64-linux-android-gcc \
            HOSTCC=gcc \
            KCFLAGS="-w -fno-stack-protector"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A32-4G
          path: out/arch/arm64/boot/Image.gz-dtb
